<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dockerized VAWT Power Calculator</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <h2>VAWT Power Calculator</h2>

    <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>
    <div th:if="${warningMessage}" class="alert warning" th:text="${warningMessage}"></div>

    <form th:action="@{/calculate}" method="post">
        <div class="form-group">
            <label>Wind Speed (m/s):</label>
            <input type="text" name="windSpeed" th:value="${windSpeed}">
        </div>
        <div class="form-group">
            <label>Height (m):</label>
            <input type="text" name="height" th:value="${height}">
        </div>
        <div class="form-group">
            <label>Rotor Diameter (m):</label>
            <input type="text" name="diameter" th:value="${diameter}">
        </div>
        <div class="form-group">
            <label>Air Density (kg/m³):</label>
            <input type="text" name="density" th:value="${density}">
        </div>
        <div class="form-group">
            <label>Power Coefficient (Cp):</label>
            <input type="text" name="cp" th:value="${cp}">
        </div>
        <button type="submit">Calculate Power</button>
    </form>

    <div th:if="${hasResult}" class="results">
        <p><strong>Swept Area (A):</strong> <span th:text="${sweptArea}"></span> m²</p>
        <p><strong>Raw Wind Power:</strong> <span th:text="${rawPowerKw}"></span> kW</p>
        <p style="color: #0f766e; font-size: 18px;"><strong>Net Usable Power:</strong> <span th:text="${netPowerKw}"></span> kW</p>
    </div>

    <section class="history" aria-labelledby="recent-calculations-title">
        <h3 id="recent-calculations-title">Recent calculations</h3>
        <p th:if="${#lists.isEmpty(recentCalculations)}" class="empty-history">No saved calculations yet.</p>
        <div th:unless="${#lists.isEmpty(recentCalculations)}" class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>Created</th>
                    <th>Wind</th>
                    <th>Area</th>
                    <th>Cp</th>
                    <th>Net power</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="calculation : ${recentCalculations}">
                    <td th:text="${#temporals.format(calculation.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="|${calculation.windSpeed} m/s|"></td>
                    <td th:text="|${calculation.sweptArea} m²|"></td>
                    <td th:text="${calculation.powerCoefficient}"></td>
                    <td th:text="|${calculation.netPowerKw} kW|"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
</body>
</html>
